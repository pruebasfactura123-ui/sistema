# ===================================================================
# CONFIGURACIÓN DE SQL SERVER EN LA NUBE (SMARTERASP)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://sql1001.site4now.net;databaseName=db_aca73c_contable;encrypt=true;trustServerCertificate=true;
spring.datasource.username=db_aca73c_contable_admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Cambiado a 'none' para evitar los errores de DDL con Constraints/Keys en SQL Server.
# Si necesitas que valide la BD sin modificarla, puedes usar 'validate'.
spring.jpa.hibernate.ddl-auto=none

# Desactivar 'show-sql' en producción ayuda a mantener limpios los logs en Render
spring.jpa.show-sql=false

# Dialecto actualizado para compatibilidad adecuada con SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# OPTIMIZACIÓN DE CONEXIONES (HIKARI CP)
# ===================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# ===================================================================
# CONFIGURACIÓN DE RED Y SERVIDOR (PUERTO DINÁMICO EN RENDER)
# ===================================================================
server.port=${PORT:10000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.main.allow-bean-definition-overriding=true