# ===================================================================
# CONFIGURACIÓN DE SQL SERVER EN LA NUBE (SMARTERASP)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://sql5112.site4now.net:1433;databaseName=db_acd48c_sistema1;encrypt=true;trustServerCertificate=true;
spring.datasource.username=db_acd48c_sistema1_admin
spring.datasource.password=Descargador11!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Cambiado a 'update' para que cree automáticamente las tablas en la nueva BD limpia.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Dialecto actualizado para compatibilidad adecuada con SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# OPTIMIZACIÓN DE CONEXIONES (HIKARI CP)
# ===================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# ===================================================================
# CONFIGURACIÓN DE RED Y SERVIDOR (PUERTO DINÁMICO EN RENDER)
# ===================================================================
server.port=${PORT:10000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.main.allow-bean-definition-overriding=true